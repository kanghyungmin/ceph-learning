apiVersion: v1
kind: Namespace
metadata:
  name: ceph-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-workspace
  namespace: ceph-lab
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: qks-shared
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-reader
  namespace: ceph-lab
spec:
  replicas: 2
  # Required anti-affinity also applies during updates on two-node clusters.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shared-reader
  template:
    metadata:
      labels:
        app: shared-reader
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: shared-reader
              topologyKey: kubernetes.io/hostname
      containers:
        - name: reader
          image: busybox:1.37.0
          command: [sh, -c, 'while true; do sleep 3600; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: shared
              mountPath: /data
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-workspace
